# GitHub Pages: 서버 없이 화면 파일만 배포 (게임 판정은 브라우저 안에서)
# 처음 한 번: Settings → Pages → Source 를 "GitHub Actions" 로
# 커맨드 패널: Settings → Secrets and variables → Actions 에 ADMIN_HASH (비밀번호 SHA-256)
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_ADMIN_HASH: ${{ secrets.ADMIN_HASH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
